<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Headscale 管理與配對</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <span class="eyebrow">HEADSCALE MCP</span><h1>管理組織的連線</h1>
      <p>登入管理介面，設定 Headscale 控制台與裝置配對。</p>
      <label>管理密碼<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登入</button><p id="login-error" role="alert"></p>
    </form>
  </section>
  <div id="workspace" class="workspace" hidden>
    <aside>
      <a class="brand" href="#overview"><span class="brand-mark">H</span><span>Headscale<small>組織連線管理</small></span></a>
      <section class="profile-control" aria-label="管理設定檔">
        <label for="profile-select">目前設定檔</label>
        <select id="profile-select"></select>
        <div class="profile-actions">
          <button id="profile-create" class="quiet" type="button">新增</button>
          <button id="profile-rename" class="quiet" type="button">重新命名</button>
          <button id="profile-delete" class="quiet" type="button">刪除</button>
        </div>
        <form id="profile-editor" hidden>
          <label for="profile-label">設定檔名稱</label>
          <input id="profile-label" required maxlength="80" autocomplete="off">
          <div class="profile-actions">
            <button id="profile-save" type="submit">儲存</button>
            <button id="profile-cancel" class="quiet" type="button">取消</button>
          </div>
        </form>
      </section>
      <nav id="navigation" aria-label="主要導覽"></nav>
      <div class="sidebar-note">每個設定檔有各自的連線與工具權限。<br>管理者工作區</div>
      <button id="logout" class="quiet">登出</button>
    </aside>
    <main>
      <header><div><span class="eyebrow">HEADSCALE MCP</span><h1 id="page-title"></h1></div><span id="status" class="badge">尚未檢查連線</span></header>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <div id="content"></div>
    </main>
  </div>
</body>
</html>
