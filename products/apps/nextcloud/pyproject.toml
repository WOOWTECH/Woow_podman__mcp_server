[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woow-nextcloud-mcp-server"
version = "1.0.0"
description = "Nextcloud MCP Admin Bundle — Web GUI + MCP Proxy + Process Manager for the vendored Nextcloud MCP server (9 tools, app password, read-only by default)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "WOOWTECH", email = "dev@woowtech.io" },
]
keywords = ["nextcloud", "webdav", "caldav", "mcp", "fastmcp", "admin", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    # 共用管理面核心（app factory / auth / config store / process manager / proxy）。
    "mcp-admin-core",
    # vendored nextcloud_mcp_server（WOOWTECH/Woow_nextcloud_mcp_server，MIT）直接 import 以下套件。
    # 來源 repo 以 == 釘版（fastmcp 3.4.5、pydantic-settings 2.15.0、typing-extensions 4.16.0…）；
    # monorepo 是單一 uv workspace，這裡改成相容範圍，實際版本由 root uv.lock 釘死（差異見 VENDORED.md）。
    "fastmcp>=4.1.3,<5",
    "mcp>=2.3,<3",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.14,<3",
    "defusedxml==0.7.1",
    "typing-extensions>=4.12",
    # 來源 repo 自 9154ad0 起無條件依賴 tzdata：python:3.12-slim 沒有系統時區資料庫，
    # 待辦事項的 TZID（含 Windows／Outlook 名稱）要靠它換算。
    "tzdata>=2026.5",
]

[project.scripts]
# MCP 子行程入口（McpProcessManager 依 config.json 的 mcp_server.command 執行期 spawn）。
# launcher 固定 Streamable HTTP、只綁 127.0.0.1、依 Tools 頁政策產生 gating env，再交給 vendored server.main()。
nextcloud-mcp-server = "nextcloud_mcp_admin.launcher:main"

[project.urls]
Homepage = "https://github.com/WOOWTECH/Woow_nextcloud_mcp_server"
Repository = "https://git-prod.woowtech.io/WOOWTECH/woow-mcp-server"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["nextcloud_mcp_admin", "nextcloud_mcp_server"]

[tool.uv.sources]
mcp-admin-core = { workspace = true }

[tool.pytest.ini_options]
# 明確的正向管理寫入 helper；原始負向 HTTP 請求不會自動補 header。
pythonpath = ["../../packages/mcp-admin-core/tests"]

testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
