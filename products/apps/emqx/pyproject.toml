[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woow-emqx-mcp-server"
version = "0.1.0"
description = "EMQX MCP Admin and 39-tool broker adapter"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp-admin-core", "fastmcp>=4.1.3,<5", "mcp>=2.3,<3",
  "httpx==0.28.1", "httpcore==1.0.9", "pydantic>=2.6", "pydantic-settings>=2.14,<3",
]

[project.scripts]
emqx-mcp-server = "emqx_mcp_admin.launcher:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["emqx_mcp_admin", "emqx_mcp_server"]

[tool.uv.sources]
mcp-admin-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
