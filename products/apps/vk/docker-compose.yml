version: "3.8"

# VK MCP Admin 本機開發用 compose。
# 與 apps/odoo-manage/docker-compose.yml 不同：vk 的目標服務 VK Host（Vibe Kanban 後端 /api/*）
# 由「外部」提供，不像 odoo-manage 需自帶 postgres + odoo，故此處只保留 mcp-admin 一段。
#
# 使用方式：
#   1. seed config.json 的 connection.vibe_backend_url 指向外部 VK Host API
#      （例：http://host.docker.internal:3000 或內網 VK Host URL），Test Connection 會打其 /api/health。
#   2. seed mcp_server.command="supergateway" + 完整 args（含 --outputTransport streamableHttp）
#      + port 8000（須與 args 的 --port 一致，否則 proxy 一律 502），讓 admin 於執行期 spawn 子行程鏈。
#   未 seed command 時 admin 仍可跑（/healthz 綠），只是無 MCP 子行程。

services:
  mcp-admin:
    build:
      context: ../..
      dockerfile: apps/vk/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - mcp_data:/data
    environment:
      MCP_ADMIN_CONFIG: /data/config.json

volumes:
  mcp_data:
