[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woow-hermes-mcp-server"
version = "1.0.0"
description = "Hermes MCP Admin + Server for managing Hermes AI assistant via MCP"
requires-python = ">=3.12"
dependencies = [
    "mcp-admin-core",
    "mcp>=2.3,<3",
]

[project.scripts]
hermes-mcp-admin = "hermes_mcp_admin.main:app"
hermes-mcp-server = "hermes_mcp_server.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_mcp_admin", "hermes_mcp_server"]

[tool.uv.sources]
mcp-admin-core = { workspace = true }
