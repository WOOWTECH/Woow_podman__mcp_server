[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-admin-core"
version = "0.1.0"
description = "Shared core library for MCP Admin GUI applications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "httpx",
    "pyjwt>=2.9",
    "python-multipart",
    "pydantic",
]

[project.optional-dependencies]
sse = ["mcp>=2.3,<3"]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_admin_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
