# Repository checks outside products/. The root Podman host MCP was retired on 2026-11-14 (Pi Web
# replaces it). What is left at the root is the quadlet-lib that products/deploy sources, vendored
# from Woow_quadlet_migration_plan, with its library checks.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No committed credentials
        run: |
          set -euo pipefail
          # Value-shaped: a secret assigned in a unit, env example or script, or a URL with
          # a password in it. Names alone (docs discuss JWT_SECRET etc.) are fine.
          if git grep -nIE '(JWT_SECRET|ADMIN_PASSWORD|MCP_AUTH_TOKEN)=[^$"[:space:]]{6,}|://[^:/@[:space:]]+:[^@/[:space:]]{4,}@' \
               -- scripts tests README.md README_zh-TW.md; then
            echo "FAIL something credential-shaped is committed"
            exit 1
          fi
          echo "ok   no credential-shaped strings"

  quadlet-lib:
    # The library checks of the vendored quadlet-ci.yml. Its Quadlet dry-run rendered the root
    # app's units, so it left with the app; the products dry-run their own units.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version | sed -n 2p

      - name: Vendored quadlet-lib is unmodified
        run: sha256sum -c scripts/lib/quadlet-lib.manifest

      - name: Vendored quadlet-lib really is the version it claims
        run: tests/lib-version.sh

      - name: The per-app lock is given back by a script that ends normally
        run: tests/lock-release.sh

      - name: shellcheck
        run: shellcheck -x scripts/lib/quadlet-lib.sh tests/*.sh
