name: headscale-product

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed Gitea source snapshot and image bindings
        run: python3 products/scripts/check-source-snapshot.py

  source-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Sync locked Headscale product
        run: uv sync --directory products --frozen --package woow-headscale-mcp-server --extra dev
      - name: Headscale API, GUI and security suite
        run: .venv/bin/pytest -q apps/headscale/tests deploy/headscale/tests --disable-warnings --tb=short
        working-directory: products
      - name: Shell syntax
        run: bash -n products/deploy/release-gate.sh products/deploy/headscale/scripts/*.sh products/deploy/headscale/tests/*.sh
      - name: No Podman socket or committed product credentials
        run: |
          set -euo pipefail
          if grep -RInE '(podman\.sock|ADMIN_PASSWORD=[^$"[:space:]]{6,}|JWT_SECRET=[^$"[:space:]]{6,})' \
               products/deploy/headscale/quadlet products/deploy/headscale/config; then
            exit 1
          fi

  image-and-quadlet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman and validate rendered Quadlet
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          products/deploy/headscale/tests/quadlet-dryrun.sh
      - name: Build Headscale product image
        run: |
          set -euo pipefail
          img="localhost/woow-headscale-mcp-admin:$(cat products/deploy/headscale/VERSION)"
          canonical=$(python3 -c 'import json; print(json.load(open("products/deploy/catalog.json"))["paas_source_commit"])')
          build_id="github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          podman build --format docker --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "CANONICAL_SOURCE=$canonical" --build-arg "RELEASE_BUILD_ID=$build_id" \
            -t "$img" -f products/deploy/headscale/Dockerfile products
          test "$(podman image inspect -f '{{json .HealthCheck}}' "$img")" != null
          python3 - "$img" "$GITHUB_SHA" "$canonical" "$build_id" <<'PY'
          import json, subprocess, sys
          sys.path.insert(0, "products/deploy")
          from release_preflight import verify_image
          image, revision, canonical, build_id = sys.argv[1:]
          labels = json.loads(subprocess.check_output(
              ["podman", "image", "inspect", "--format", "{{json .Labels}}", image]))
          expected = {"org.opencontainers.image.revision": revision,
                      "io.woowtech.canonical-source": canonical,
                      "io.woowtech.release-build": build_id}
          assert all(labels.get(key) == value for key, value in expected.items())
          image_id = subprocess.check_output(
              ["podman", "image", "inspect", "--format", "{{.Id}}", image],
              text=True).strip()
          if not image_id.startswith("sha256:"):
              image_id = "sha256:" + image_id
          manifest = {"images": {"headscale": {"linux/amd64": {
              "reference": image, "image_id": image_id, "build_id": build_id,
              "labels": expected}}}}
          assert verify_image(manifest, "headscale", image, revision, canonical) == image_id
          PY
      - name: Start disposable container and exercise MCP boundary
        run: |
          set -euo pipefail
          img="localhost/woow-headscale-mcp-admin:$(cat products/deploy/headscale/VERSION)"
          products/deploy/headscale/tests/container-smoke.sh "$img"
