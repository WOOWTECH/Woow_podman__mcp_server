[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-admin-core"
version = "0.1.0"
description = "Shared core library for MCP Admin GUI applications (product-agnostic; used by the Podman MCP admin console)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "httpx",
    "pyjwt>=2.9",
    "python-multipart",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_admin_core"]
