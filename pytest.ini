[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio in auto mode: `async def test_*` runs without a decorator.
asyncio_mode = auto

# Live probes against a real Podman host are opt-in only; they are excluded
# from the default run. Enable with:  pytest -m live
addopts = -ra -m "not live"

markers =
    live: opt-in tests that hit a real, reachable Podman socket (needs podman.socket).
